      and "Recommended Action".
      The Priority section must contain exactly one of: P0, P1, P2, or P3.
      Be concrete. Cite the most important facts from the report.
    expected_skill: bug-triage
    fixture_path: fixtures/search-pagination-broken.md
    timeout_seconds: 300
    assertions:
      final_contains:
        - "Priority"
        - "Rationale"
        - "Impact"
        - "Recommended Action"
        - "P1"
        - "workaround"
      tool_called: []
      tool_not_called: []
      files_created: []
    rubric:
      task_success: "Does the answer give priority P1 (regression with workaround) with the four required sections?"
      skill_adherence: "Does the answer note the regression and revenue impact while acknowledging the workaround?"
      output_quality: "Does the answer balance severity signals against mitigations?"

