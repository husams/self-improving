cases:
  - id: outage-payments
    prompt: |
      Use the bug-triage skill to triage this bug report.
      Output four labeled sections: "Priority", "Rationale", "Impact",
      and "Recommended Action".
      The Priority section must contain exactly one of: P0, P1, P2, or P3.
      Be concrete. Cite the most important facts from the report.
    expected_skill: bug-triage
    fixture_path: fixtures/payment-gateway-down.md
    timeout_seconds: 300
    assertions:
      final_contains:
        - "Priority"
        - "Rationale"
        - "Impact"
        - "Recommended Action"
        - "P0"
        - "revenue"
      tool_called: []
      tool_not_called: []
      files_created: []
    rubric:
      task_success: "Does the answer give priority P0 with the four required sections?"
      skill_adherence: "Does the answer cite concrete facts from the report?"
      output_quality: "Does the rationale connect outage severity to a recommended action?"
    quality_checks:
      - regex: "P0"
      - similarity:
          reference: "Priority: P0. Rationale: revenue impact during the payment outage. Impact: high. Recommended Action: page the on-call engineer."
          method: rouge
          threshold: 0.4

